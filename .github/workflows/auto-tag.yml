name: Auto tag on merge

on:
  pull_request:
    branches: [ master, main ]
    types:
      - closed
  workflow_dispatch:
  workflow_call:
    inputs:
      branch:
        description: 'The branch to check and apply the tag to'
        required: false
        type: string
        default: 'master'
    outputs:
      generated_tag:
        description: 'The newly generated semantic date-based tag'
        value: ${{ jobs.create-tag.outputs.new_tag }}
    secrets:
      PAT_TOKEN:
        description: 'Personal Access Token with repository write permissions to push tags'
        required: true

concurrency:
  group: production-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  create-tag:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        !contains(github.event.pull_request.labels.*.name, 'skip release')
      )
    runs-on: ubuntu-latest

    outputs:
      new_tag: ${{ steps.new_tag.outputs.tag }}

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.event.pull_request.base.ref || github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Git configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Generate new tag
        id: new_tag
        shell: bash
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          CURRENT_DATE=$(date +"%y.%m.%d")

          # Detect prerelease label
          IS_PRERELEASE=false

          if [[ ",$PR_LABELS," == *",pre release,"* ]]; then
            IS_PRERELEASE=true
          fi

          echo "Date: $CURRENT_DATE"
          echo "Prerelease: $IS_PRERELEASE"

          # Find all valid tags for today, including prereleases
          DATE_REGEX="${CURRENT_DATE//./\\.}"

          mapfile -t TAGS < <(
            git tag --list "${CURRENT_DATE}.*" |
            grep -E "^${DATE_REGEX}\.[0-9]+(-pre)?$" |
            sort -V || true
          )

          # Determine next patch version
          if [[ ${#TAGS[@]} -eq 0 ]]; then
            PATCH=0
          else
            LAST_TAG="${TAGS[-1]}"

            LAST_PATCH=$(echo "$LAST_TAG" | sed -E \
              's/^[0-9]{2}\.[0-9]{2}\.[0-9]{2}\.([0-9]+)(-pre)?$/\1/')

            PATCH=$((LAST_PATCH + 1))
          fi

          # Generate tag
          NEW_TAG="${CURRENT_DATE}.${PATCH}"

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            NEW_TAG="${NEW_TAG}-pre"
          fi

          # Prevent accidental duplicate tags
          if git rev-parse -q --verify "refs/tags/$NEW_TAG" >/dev/null; then
            echo "::error::Tag already exists: $NEW_TAG"
            exit 1
          fi

          echo "Generated tag: $NEW_TAG"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          set -euo pipefail

          TAG="${{ steps.new_tag.outputs.tag }}"

          git tag "$TAG"
          git push origin "$TAG"